<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuellig Pharma | Hologram Serial Number Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f5f7;color:#243746;font-size:13px}
.header{height:72px;background:white;border-bottom:1px solid #c7d1d8;display:flex;align-items:center;justify-content:space-between;padding:8px 22px}
.logo{width:225px;height:auto;max-height:56px;object-fit:contain}
.user{display:flex;align-items:center;gap:12px;color:#526572}.user strong{color:#163f60}
.nav{height:48px;background:#fff;border-bottom:1px solid #c7d1d8;display:flex;align-items:stretch;padding-left:12px;overflow-x:auto}
.nav button{border:0;background:#fff;color:#16496e;font-weight:bold;padding:0 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{background:#f1f5f7}.nav button.active{border-bottom-color:#a50000;background:#f7f8f9}
.main{max-width:1440px;margin:auto;padding:18px}
.title{font-size:25px;color:#075d94;font-weight:bold}.subtitle{color:#70808a;font-size:12px;margin:5px 0 16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi{background:white;border:1px solid #c7d1d8;padding:14px 17px;min-width:155px;flex:1;box-shadow:0 1px 3px #0001}
.kpi .n{font-size:25px;color:#086fae;font-weight:bold}.kpi .l{font-size:12px;color:#687b87;margin-top:3px}
.panel{background:#fff;border:1px solid #c7d1d8;margin:10px 0;box-shadow:0 1px 4px #00000010}.panel-title{background:#eaf0f4;border-bottom:1px solid #c7d1d8;padding:10px 12px;color:#173f61;font-weight:bold}.panel-body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:bold;font-size:12px;color:#526b79;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #aebbc3;border-radius:2px;padding:8px;background:white;font:inherit}input[readonly]{background:#f5f7f8;color:#536775}
.scan{display:flex;gap:5px}.scan input{flex:1}
.serialbox{position:relative}.serialbox input{padding-right:36px}.serialbox .qrbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:3px;display:flex;align-items:center;justify-content:center;border-radius:2px}.serialbox .qrbtn:hover{background:#e7eef3}.serialbox .qrbtn svg{width:19px;height:19px;display:block}
input[readonly].auto{background:#f0f6fa;color:#0b5d95;font-weight:bold}
.checkcol{width:34px;text-align:center}
.matrix-role{font-weight:bold;color:#173f61}
.expiry-cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.expiry-card{background:#fff;border:1px solid #c7d1d8;padding:14px 17px;min-width:165px;flex:1;box-shadow:0 1px 3px #0001;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.expiry-card:hover{box-shadow:0 3px 10px #0002;border-color:#0b5d95}
.expiry-card .n{font-size:23px;font-weight:bold}
.expiry-card .l{font-size:12px;color:#687b87;margin-top:3px}
.expiry-card.c1 .n{color:#b00020}.expiry-card.c2 .n{color:#a45c00}.expiry-card.c3 .n{color:#0b5d95}.expiry-card.c4 .n{color:#173f61}
.filterrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0 4px}
.filterrow label{display:block;font-weight:bold;font-size:12px;color:#526b79;margin-bottom:5px}
.filterrow input,.filterrow select{height:36px;border:1px solid #b9c6d0;border-radius:4px;padding:7px}
.linebar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px}
.linebar .totals{font-size:12px;color:#526b79}
.linebar .totals b{color:#173f61}
.attach-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.attach-thumb{position:relative;width:84px;height:84px;border:1px solid #c7d1d8;border-radius:4px;overflow:hidden;background:#f5f7f8}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-thumb button{position:absolute;top:2px;right:2px;background:#00000090;color:#fff;border:0;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;padding:0}
.attach-thumb .fname{position:absolute;bottom:0;left:0;right:0;background:#00000090;color:#fff;font-size:9px;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid #9eabb4;background:#fff;color:#173f61;padding:8px 13px;border-radius:2px;cursor:pointer;font-weight:bold}.btn:hover{background:#edf3f6}.primary{background:#0b5d95;color:white;border-color:#0b5d95}.accept{background:#19733e;color:white;border-color:#19733e}.danger{background:#b0202c;color:white;border-color:#b0202c}.danger:hover{background:#911422}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:13px}.status{padding:5px 0;font-weight:normal}.success{color:#10733b}.warning{color:#a45c00}.error{color:#b00020}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#e8eef2;color:#29485e;text-align:left;padding:9px;border:1px solid #d0d9de}td{padding:9px;border:1px solid #d0d9de}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:700px){.tablewrap table{min-width:640px}}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:10}.modal-box{background:#fff;width:440px;max-width:92%;padding:18px;border-radius:2px;box-shadow:0 10px 40px #0005}.modal-title{font-size:20px;color:#173f61;font-weight:bold;margin-bottom:14px}
.qrmodal-box{width:420px}
.qrvideo-wrap{position:relative;background:#0c1a24;border-radius:4px;overflow:hidden;aspect-ratio:1/1;max-height:320px}
.qrvideo-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.qrframe{position:absolute;inset:14%;border:3px solid #34d17a;border-radius:8px;box-shadow:0 0 0 1000px #00000055;pointer-events:none}
@media(max-width:700px){.header{height:auto;gap:10px;flex-wrap:wrap}.logo{width:180px}.main{padding:10px}}

.report-criteria{background:#fff;border:1px solid #c7d1d8;padding:12px;margin-top:10px}
.report-grid{display:grid;grid-template-columns:140px 260px 130px 130px 130px 1fr;gap:12px;align-items:end}
.report-grid label{text-align:left;display:block;margin-bottom:5px;color:#526572;font-weight:normal}
.report-grid input,.report-grid select{height:36px;width:100%;border:1px solid #b9c6d0;border-radius:4px;padding:7px;background:#fff}
.report-actions{display:flex;gap:8px;align-items:end;justify-content:flex-end}
.stockcalc{border:1px dashed #aebbc5;background:#fff;padding:14px;margin-top:10px;display:grid;grid-template-columns:1fr 35px 1fr 35px 1fr;align-items:center}
.note{margin-top:10px;color:#687986;font-size:12px}.stockcalc .cap{font-size:12px;color:#687986}.stockcalc .val{font-size:18px;font-weight:bold;margin-top:5px}.stockcalc .deduct{color:#b00020}.stockcalc .after{color:#087c35}.stockcalc .arrow{text-align:center;color:#657681;font-size:20px}
.previewbox{width:900px;max-width:95%;max-height:88vh;overflow:auto;background:#fff;padding:18px;border:1px solid #777}
.redbar{margin-top:24px;background:#7e1d2b;color:#fff;padding:9px 12px;font-weight:bold;letter-spacing:.3px}
.previewbox h2{margin:0 0 12px;color:#7e1d2b}.previewbox table{width:100%;border-collapse:collapse}.previewbox th,.previewbox td{border:1px solid #ccc;padding:7px;text-align:left}.previewbox th{background:#eee}
@media(max-width:1050px){.report-grid{grid-template-columns:1fr 1fr}.stockcalc{grid-template-columns:1fr 25px 1fr 25px 1fr}}
</style>
</head>

let qrStream=null,qrTargetId=null,qrDetectTimer=null;
async function scan(id){
qrTargetId=id;
document.getElementById('qrManual').value='';
document.getElementById('qrStatus').textContent='Requesting camera access…';
document.getElementById('qrModal').style.display='flex';
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('qrStatus').innerHTML='<span class="warning">Camera not available on this device/browser. Enter the code manually below.</span>';return}
try{
qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
let video=document.getElementById('qrVideo');
video.srcObject=qrStream;
await video.play();
document.getElementById('qrStatus').innerHTML='Point the camera at the hologram QR code.';
startQrDetection();
}catch(err){
document.getElementById('qrStatus').innerHTML='<span class="warning">Camera access denied or unavailable ('+(err&&err.message?err.message:err)+'). Enter the code manually below.</span>';
}
}
function startQrDetection(){
if(!('BarcodeDetector' in window))return;
let detector;
try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){return}
qrDetectTimer=setInterval(async()=>{
let video=document.getElementById('qrVideo');
if(!video||video.readyState<2)return;
try{
let codes=await detector.detect(video);
if(codes&&codes.length){applyQrResult(codes[0].rawValue)}
}catch(e){}
},350);
}
function applyQrResult(value){
if(qrTargetId){
let el=document.getElementById(qrTargetId);
let group=el.getAttribute('data-group');
let handled=false;
if(group){
try{
let ids=JSON.parse(group);
let parts=String(value).split('|');
if(parts.length===4){
[['prefix',0],['start',1],['end',2],['suffix',3]].forEach(([key,idx])=>{
if(ids[key]){let e=document.getElementById(ids[key]);if(e){e.value=parts[idx];if(e.oninput)e.oninput()}}
});
handled=true;
}
}catch(e){}
}
if(!handled){el.value=value;if(el.oninput)el.oninput()}
}
closeQrModal();
msg('QR code captured.');
}
function qrManualSubmit(){let v=document.getElementById('qrManual').value.trim();if(!v)return msg('Enter a value, or allow camera access to scan automatically.');applyQrResult(v)}
function closeQrModal(){
if(qrDetectTimer){clearInterval(qrDetectTimer);qrDetectTimer=null}
if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}
let video=document.getElementById('qrVideo');if(video)video.srcObject=null;
document.getElementById('qrModal').style.display='none';
}
function serialSuffix(v){let m=String(v||'').trim().match(/(\d+)$/);return m?parseInt(m[1],10):null}

function confirmReceipt(){
if(!document.getElementById('ibd').value)return msg('Please select an IBD document.');
let expected=Number((document.getElementById('rq').value||'0').toString().replace(/,/g,''))||0;
let splitMode=document.getElementById('rSplitToggle').value==='Yes';
if(splitMode){
let filled=receiptSplitLines.filter(l=>l.start&&l.end);
if(!filled.length)return msg('Please add at least one batch split line with Start and End Hologram numbers.');
let total=filled.reduce((s,l)=>s+qtyFromRange(l.start,l.end),0);
if(expected&&total!==expected){showMismatchModal(`The Expected Quantity from the IBD is <b>${expected.toLocaleString()}</b> but the total Quantity Received across ${filled.length} line(s) is <b>${total.toLocaleString()}</b>. These do not match.`,()=>finalizeReceipt());return}
finalizeReceipt();
}else{
if(!rs.value||!re.value||!rqty.value)return msg('Please enter/capture Start Hologram No., End Hologram No. and Received Quantity.');
let received=Number(rqty.value)||0;
if(expected&&received&&expected!==received){showMismatchModal(`The Expected Quantity from the IBD is <b>${expected.toLocaleString()}</b> but the Received Quantity calculated from the serial range is <b>${received.toLocaleString()}</b>. These do not match.`,()=>finalizeReceipt());return}
finalizeReceipt();
}
}

function makeSimplePDF(lines){let esc=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');let c='BT\\n/F1 9 Tf\\n40 800 Td\\n';lines.forEach((l,i)=>{if(i)c+='0 -16 Td\\n';c+='('+esc(l.slice(0,120))+') Tj\\n'});c+='ET';let o=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${c.length} >>\\nstream\\n${c}\\nendstream`];let p='%PDF-1.4\\n',off=[0];o.forEach((v,i)=>{off[i+1]=p.length;p+=(i+1)+' 0 obj\\n'+v+'\\nendobj\\n'});let x=p.length;p+='xref\\n0 '+(o.length+1)+'\\n0000000000 65535 f \\n';for(let i=1;i<=o.length;i++)p+=String(off[i]).padStart(10,'0')+' 00000 n \\n';p+='trailer\\n<< /Size '+(o.length+1)+' /Root 1 0 R >>\\nstartxref\\n'+x+'\\n%%EOF';return new Blob([p],{type:'application/pdf'})}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}

function deleteSelectedUser(){let i=getSelectedUserIndex();if(i===null)return msg('Please select a user from the list.');let u=usersData[i];if(!confirm(`Delete user "${u[0]}"? This action is simulated in this prototype.`))return;usersData.splice(i,1);users();msg('Selected user deleted.')}
