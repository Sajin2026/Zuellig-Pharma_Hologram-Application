<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zuellig Pharma | Hologram Serial Number Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f2f5f7;color:#243746;font-size:13px}
.header{height:72px;background:white;border-bottom:1px solid #c7d1d8;display:flex;align-items:center;justify-content:space-between;padding:8px 22px}
.logo{width:225px;height:auto;max-height:56px;object-fit:contain}
.user{display:flex;align-items:center;gap:12px;color:#526572}.user strong{color:#163f60}
.nav{height:48px;background:#fff;border-bottom:1px solid #c7d1d8;display:flex;align-items:stretch;padding-left:12px;overflow-x:auto}
.nav button{border:0;background:#fff;color:#16496e;font-weight:bold;padding:0 15px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{background:#f1f5f7}.nav button.active{border-bottom-color:#a50000;background:#f7f8f9}
.main{max-width:1440px;margin:auto;padding:18px}
.title{font-size:25px;color:#075d94;font-weight:bold}.subtitle{color:#70808a;font-size:12px;margin:5px 0 16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi{background:white;border:1px solid #c7d1d8;padding:14px 17px;min-width:155px;flex:1;box-shadow:0 1px 3px #0001}
.kpi .n{font-size:25px;color:#086fae;font-weight:bold}.kpi .l{font-size:12px;color:#687b87;margin-top:3px}
.panel{background:#fff;border:1px solid #c7d1d8;margin:10px 0;box-shadow:0 1px 4px #00000010}.panel-title{background:#eaf0f4;border-bottom:1px solid #c7d1d8;padding:10px 12px;color:#173f61;font-weight:bold}.panel-body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:bold;font-size:12px;color:#526b79;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #aebbc3;border-radius:2px;padding:8px;background:white;font:inherit}input[readonly]{background:#f5f7f8;color:#536775}
.scan{display:flex;gap:5px}.scan input{flex:1}
.serialbox{position:relative}.serialbox input{padding-right:36px}.serialbox .qrbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:3px;display:flex;align-items:center;justify-content:center;border-radius:2px}.serialbox .qrbtn:hover{background:#e7eef3}.serialbox .qrbtn svg{width:19px;height:19px;display:block}
input[readonly].auto{background:#f0f6fa;color:#0b5d95;font-weight:bold}
.checkcol{width:34px;text-align:center}
.matrix-role{font-weight:bold;color:#173f61}
.btn{border:1px solid #9eabb4;background:#fff;color:#173f61;padding:8px 13px;border-radius:2px;cursor:pointer;font-weight:bold}.btn:hover{background:#edf3f6}.primary{background:#0b5d95;color:white;border-color:#0b5d95}.accept{background:#19733e;color:white;border-color:#19733e}.danger{background:#b0202c;color:white;border-color:#b0202c}.danger:hover{background:#911422}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:13px}.status{padding:5px 0;font-weight:normal}.success{color:#10733b}.warning{color:#a45c00}.error{color:#b00020}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#e8eef2;color:#29485e;text-align:left;padding:9px;border:1px solid #d0d9de}td{padding:9px;border:1px solid #d0d9de}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:10}.modal-box{background:#fff;width:440px;max-width:92%;padding:18px;border-radius:2px;box-shadow:0 10px 40px #0005}.modal-title{font-size:20px;color:#173f61;font-weight:bold;margin-bottom:14px}
@media(max-width:700px){.header{height:auto;gap:10px;flex-wrap:wrap}.logo{width:180px}.main{padding:10px}}

.report-criteria{background:#fff;border:1px solid #c7d1d8;padding:12px;margin-top:10px}
.report-grid{display:grid;grid-template-columns:150px 320px 150px 150px 1fr;gap:12px;align-items:end}
.report-grid label{text-align:left;display:block;margin-bottom:5px;color:#526572;font-weight:normal}
.report-grid input,.report-grid select{height:36px;width:100%;border:1px solid #b9c6d0;border-radius:4px;padding:7px;background:#fff}
.report-actions{display:flex;gap:8px;align-items:end;justify-content:flex-end}
.stockcalc{border:1px dashed #aebbc5;background:#fff;padding:14px;margin-top:10px;display:grid;grid-template-columns:1fr 35px 1fr 35px 1fr;align-items:center}
.note{margin-top:10px;color:#687986;font-size:12px}.stockcalc .cap{font-size:12px;color:#687986}.stockcalc .val{font-size:18px;font-weight:bold;margin-top:5px}.stockcalc .deduct{color:#b00020}.stockcalc .after{color:#087c35}.stockcalc .arrow{text-align:center;color:#657681;font-size:20px}
.previewbox{width:900px;max-width:95%;max-height:88vh;overflow:auto;background:#fff;padding:18px;border:1px solid #777}
.previewbox h2{margin:0 0 12px;color:#7e1d2b}.previewbox table{width:100%;border-collapse:collapse}.previewbox th,.previewbox td{border:1px solid #ccc;padding:7px;text-align:left}.previewbox th{background:#eee}
@media(max-width:1050px){.report-grid{grid-template-columns:1fr 1fr}.stockcalc{grid-template-columns:1fr 25px 1fr 25px 1fr}}
</style>
</head>
